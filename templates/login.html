<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; } </style>
    <script src="/static/app.js" defer></script>
    <title>เข้าสู่ระบบ | J MATCH ARENA</title>
</head>
<body class="bg-[url('https://images.unsplash.com/photo-1518605368461-1e96a29ec1b4?q=80&w=2000&auto=format&fit=crop')] bg-cover bg-center min-h-screen flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-zinc-950/80 backdrop-blur-sm"></div>
    <div class="relative z-10 bg-zinc-900/90 p-10 rounded-2xl shadow-2xl w-full max-w-md border border-zinc-800 backdrop-blur-lg">
        <div class="text-center mb-8 flex flex-col items-center">
            <img src="/static/logo.png" alt="Logo" class="w-32 h-32 mb-4 drop-shadow-[0_0_15px_rgba(236,72,153,0.5)] rounded-full">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-purple-500 mb-2 uppercase tracking-wider">J MATCH ARENA</h1>
            <p class="text-zinc-400 text-sm">ยินดีต้อนรับสู่ระบบจองสนามฟุตบอล</p>
        </div>
        {{if .Error}}
        <div class="mb-5 p-3 bg-red-500/10 border border-red-500/50 rounded-lg text-red-400 text-sm font-medium">{{.Error}}</div>
        {{end}}
        <form action="/login" method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{.CSRF}}">
            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                <input type="text" name="username" required maxlength="30" autocomplete="username" placeholder="ใส่ชื่อผู้ใช้ของคุณ"
                       class="w-full mt-1 p-3 bg-zinc-950/50 rounded-lg border border-zinc-700 focus:border-pink-500 outline-none text-white placeholder-zinc-600">
            </div>
            <div>
                <label class="block text-sm font-medium text-zinc-300 mb-1">รหัสผ่าน (Password)</label>
                <input type="password" name="password" required maxlength="72" autocomplete="current-password" placeholder="••••••••"
                       class="w-full mt-1 p-3 bg-zinc-950/50 rounded-lg border border-zinc-700 focus:border-pink-500 outline-none text-white placeholder-zinc-600">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg">เข้าสู่ระบบ</button>
        </form>
        <p class="mt-6 text-center text-sm text-zinc-400">ยังไม่มีบัญชีใช่ไหม? <a href="/register" class="text-pink-400 font-semibold hover:text-pink-300 underline underline-offset-4">สมัครสมาชิกที่นี่</a></p>
    </div>
</body>
</html>
